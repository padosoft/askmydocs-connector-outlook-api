name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, mbstring, openssl, pdo_sqlite
          coverage: none
      - run: composer validate --strict
      - run: composer require --dev --no-interaction --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
      - run: vendor/bin/pint --test
      - run: composer analyse
